<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <!-- Outer Pulse Wave (Semi-transparent) -->
  <circle cx="40" cy="40" r="36" stroke="#FC541E" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="3 3"/>
  <!-- Middle Coordinate Ring -->
  <circle cx="40" cy="40" r="24" stroke="#FC541E" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Crosshair Reticles -->
  <line x1="40" y1="10" x2="40" y2="20" stroke="#FC541E" stroke-width="2"/>
  <line x1="40" y1="60" x2="40" y2="70" stroke="#FC541E" stroke-width="2"/>
  <line x1="10" y1="40" x2="20" y2="40" stroke="#FC541E" stroke-width="2"/>
  <line x1="60" y1="40" x2="70" y2="40" stroke="#FC541E" stroke-width="2"/>
  <!-- Core Target Beacon -->
  <circle cx="40" cy="40" r="8" fill="#FC541E"/>
  <circle cx="40" cy="40" r="4" fill="#FFFFFF"/>
</svg>
